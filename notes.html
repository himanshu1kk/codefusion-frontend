<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Journal | CFF Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #0b0f17;
      --surface-glass: rgba(18, 24, 38, 0.75);
      --surface-elevated: rgba(22, 28, 44, 0.9);
      --border-soft: rgba(255, 255, 255, 0.08);
      --border-active: rgba(56, 189, 248, 0.3);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-sky: #38bdf8;
      --accent-indigo: #818cf8;
      --accent-emerald: #10b981;
      --danger: #ef4444;
      --amber: #f59e0b;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-glow: 0 20px 35px -12px rgba(0,0,0,0.5);
      --backdrop-blur: blur(18px);
      --transition-smooth: 0.25s cubic-bezier(0.2, 0.0, 0, 1.0);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at 20% 20%, #131c2e, #05070b 80%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 0 1.5rem 1.5rem;
      backdrop-filter: blur(2px);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .background-ambient {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: radial-gradient(ellipse at 70% 20%, rgba(56,189,248,0.06) 0%, transparent 50%),
                  radial-gradient(ellipse at 30% 80%, rgba(129,140,248,0.06) 0%, transparent 50%);
      pointer-events: none;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.3rem 0.5rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border-soft);
      backdrop-filter: var(--backdrop-blur);
      background: rgba(8, 12, 22, 0.6);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      text-decoration: none;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .brand span {
      background: linear-gradient(135deg, var(--accent-sky), var(--accent-indigo));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      background: rgba(255,255,255,0.03);
      transition: var(--transition-smooth);
    }
    .nav-link:hover {
      background: rgba(255,255,255,0.08);
      color: white;
    }

    .container {
      display: flex;
      gap: 2rem;
      flex: 1;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .meta-panel {
      width: 340px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .glass-card {
      background: var(--surface-glass);
      backdrop-filter: var(--backdrop-blur);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-glow);
      transition: var(--transition-smooth);
    }

    h3 {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: -0.2px;
      margin-bottom: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-primary);
    }

    .input-group {
      margin-bottom: 1.3rem;
    }
    .input-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      display: block;
    }
    input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      color: white;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition-smooth);
    }
    input:focus {
      border-color: var(--accent-sky);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.25);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.85rem;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: 0.2s;
      box-shadow: 0 8px 18px -6px rgba(79,70,229,0.4);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.15);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    #problemInfo {
      display: none;
    }
    #problemInfo.active {
      display: block;
      animation: fadeSlide 0.25s ease;
    }
    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.6rem;
    }
    .info-label {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .info-value {
      font-weight: 600;
      font-size: 1.1rem;
    }
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.8rem 0 1rem;
    }
    .tag {
      background: rgba(255,255,255,0.05);
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-size: 0.7rem;
      color: var(--text-secondary);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .cf-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--accent-sky);
      text-decoration: none;
      font-weight: 500;
      border: 1px solid rgba(56,189,248,0.25);
      padding: 0.65rem;
      border-radius: 12px;
      transition: var(--transition-smooth);
    }
    .cf-link:hover {
      background: rgba(56,189,248,0.08);
    }

    .editor-panel {
      flex: 1;
      background: var(--surface-elevated);
      backdrop-filter: var(--backdrop-blur);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 500px;
    }
    .editor-toolbar {
      padding: 1rem 1.5rem;
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .btn-save {
      background: var(--accent-emerald);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: var(--transition-smooth);
      background: linear-gradient(135deg, #10b981, #059669);
    }
    .btn-save:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .status-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      padding: 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      line-height: 1.7;
      resize: none;
      outline: none;
      width: 100%;
    }
    textarea::placeholder {
      color: rgba(255,255,255,0.2);
    }
    .counter {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    #toast-container {
      position: fixed;
      bottom: 25px;
      right: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
    }
    .toast {
      padding: 0.9rem 1.5rem;
      border-radius: 14px;
      font-weight: 500;
      backdrop-filter: blur(20px);
      background: rgba(20, 25, 35, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideInToast 0.3s ease;
    }
    .toast.success { border-left: 4px solid var(--accent-emerald); }
    .toast.error { border-left: 4px solid var(--danger); }
    @keyframes slideInToast {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 850px) {
      .container {
        flex-direction: column;
      }
      .meta-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<div class="background-ambient"></div>

<nav>
  <a href="/" class="brand"><span>&lt;/&gt;</span> CFF.Journal</a>
  <a href="codeLogin.html" class="nav-link" id="loginLink">Login</a>
</nav>

<div class="container">
  <div class="meta-panel">
    <div class="glass-card">
      <h3>🔍 Problem Lookup</h3>
      <div class="input-group">
        <label class="input-label">Contest ID</label>
        <input type="number" id="inpContestId" placeholder="1352">
      </div>
      <div class="input-group">
        <label class="input-label">Problem Index</label>
        <input type="text" id="inpIndex" placeholder="C" maxlength="2">
      </div>
      <button id="btnFetch" class="btn-primary">
        <span>📡</span> Fetch Details
      </button>
    </div>

    <div id="problemInfo" class="glass-card">
      <div id="metaContent"></div>
      <a href="#" target="_blank" id="dispLink" class="cf-link">Open in Codeforces ↗</a>
    </div>
  </div>

  <div class="editor-panel">
    <div class="editor-toolbar">
      <div class="toolbar-left">
        <span style="font-weight:600;">📝 Notes</span>
        <span class="status-text" id="saveStatusText">⚪ Not loaded</span>
      </div>
      <div style="display: flex; align-items: center; gap: 15px;">
        <span class="counter" id="charCounter">0</span>
        <button id="btnSave" class="btn-save" disabled>
          <span>💾</span> Save
        </button>
      </div>
    </div>
    <textarea id="notesArea" placeholder="Start writing your approach..." disabled></textarea>
  </div>
</div>

<div id="toast-container"></div>

<script>
  (function() {
    // ---------- CONSTANTS ----------
    const API_BASE = 'https://codefusion-backend-tzj4.onrender.com/api/v0.1/cf';
    const PROBLEM_META_URL = `${API_BASE}/problems/meta`;
    const NOTES_SAVE_URL = `${API_BASE}/notes/save`;
    const NOTES_GET_URL = (contestId, index) => `${API_BASE}/notes/${contestId}/${index}`;
    const LOGIN_PAGE = "./codeLogin.html";

    // Error codes mapping
    const ERROR_MESSAGES = {
      4000: 'Invalid contest ID or problem index.',
      4001: 'Session expired. Please login again.',
      4004: 'User account not found.',
      4005: 'NOTE_NOT_FOUND',
      4008: 'Codeforces API unavailable.',
      4010: 'Invalid email format.',
      4011: 'Email already verified.',
      4012: 'OTP expired.',
      4013: 'OTP attempt limit exceeded.',
      4014: 'OTP record missing.',
      4015: 'Invalid OTP code.',
      5000: 'Internal server error. Try again later.'
    };

    // DOM elements
    const inpContestId = document.getElementById('inpContestId');
    const inpIndex = document.getElementById('inpIndex');
    const btnFetch = document.getElementById('btnFetch');
    const btnSave = document.getElementById('btnSave');
    const problemInfo = document.getElementById('problemInfo');
    const metaContent = document.getElementById('metaContent');
    const dispLink = document.getElementById('dispLink');
    const notesArea = document.getElementById('notesArea');
    const saveStatusText = document.getElementById('saveStatusText');
    const charCounter = document.getElementById('charCounter');
    const toastContainer = document.getElementById('toast-container');
    const loginLink = document.getElementById('loginLink');

    let currentContestId = null;
    let currentIndex = null;
    let originalNoteContent = '';

    // ---------- UTILS ----------
    function getToken() {
    return localStorage.getItem("accessToken");
}

function setToken(token) {
    if (token)
        localStorage.setItem("accessToken", token);
    else
        localStorage.removeItem("accessToken");
}

    function isAuthenticated() {
      return !!getToken();
    }

    function updateAuthUI() {
      const loggedIn = isAuthenticated();
      loginLink.textContent = loggedIn ? 'Logout' : 'Login';
      loginLink.href = loggedIn ? '#' : LOGIN_PAGE;
      if (!loggedIn) {
        btnSave.disabled = true;
        notesArea.disabled = true;
        saveStatusText.innerText = '🔒 Login required';
      }
    }

    loginLink.addEventListener('click', (e) => {
      if (isAuthenticated()) {
        e.preventDefault();
        setToken(null);
        showToast('Logged out', 'success');
        disableNotes('Login required');
      }
    });

    function redirectToLogin() {
      window.location.href = LOGIN_PAGE;
    }

    async function apiRequest(url, options = {}) {
      const token = getToken();
      const headers = {
        'Content-Type': 'application/json',
        ...(token && { 'Authorization': `Bearer ${token}` }),
        ...options.headers
      };

      const response = await fetch(url, { ...options, headers });
      
      if (response.status === 401) {
        setToken(null);
        showToast('Session expired. Redirecting...', 'error');
        setTimeout(() => redirectToLogin(), 1500);
        throw new Error('Unauthorized');
      }

      const contentType = response.headers.get('content-type');
      let data = null;
      if (contentType && contentType.includes('application/json')) {
        data = await response.json();
      }

      if (!response.ok) {
        const apiCode = data?.apiResponseCode;
        const message = data?.message || 'Request failed';
        throw { apiCode, message, status: response.status };
      }

      return data;
    }

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${message}`;
      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(30px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function normalizeIndex(raw) {
      return raw.trim().toUpperCase();
    }

    function updateCharCount() {
      const len = notesArea.value.length;
      charCounter.innerText = `${len} chars`;
    }

    function setSavingState(disabled, text = '💾 Save') {
      btnSave.disabled = disabled;
      btnSave.innerHTML = disabled ? '<span>⏳</span> Saving...' : text;
    }

    function disableNotes(reason = '') {
      notesArea.disabled = true;
      btnSave.disabled = true;
      saveStatusText.innerText = reason || '🔒 Unavailable';
    }

    function enableNotes(status = 'Ready') {
      if (!isAuthenticated()) {
        disableNotes('Login required');
        return;
      }
      notesArea.disabled = false;
      btnSave.disabled = false;
      saveStatusText.innerText = status;
    }

    // ---------- PROBLEM METADATA ----------
    async function fetchProblemMeta(contestId, index) {
      const url = `${PROBLEM_META_URL}?contestId=${contestId}&index=${encodeURIComponent(index)}`;
      return await apiRequest(url);
    }

    function renderProblemMeta(problem) {
      const rating = problem.rating || 'Unrated';
      let ratingColor = 'var(--text-muted)';
      if (problem.rating >= 2000) ratingColor = '#f59e0b';
      else if (problem.rating >= 1600) ratingColor = '#818cf8';
      else if (problem.rating) ratingColor = '#10b981';

      const tagsHtml = (problem.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
      
      metaContent.innerHTML = `
        <div style="margin-bottom:0.8rem; font-weight:700; font-size:1.2rem;">${problem.name}</div>
        <div class="info-row"><span class="info-label">Rating</span><span class="info-value" style="color:${ratingColor}">${rating}</span></div>
        <div class="tag-cloud">${tagsHtml || '<span class="tag">none</span>'}</div>
      `;
      dispLink.href = `https://codeforces.com/contest/${problem.contestId}/problem/${problem.index}`;
      problemInfo.classList.add('active');
    }

    // ---------- NOTES OPERATIONS ----------
    async function loadNote(contestId, index) {
      const url = NOTES_GET_URL(contestId, index);
      return await apiRequest(url);
    }

    async function saveNote(contestId, index, content) {
      const payload = {
        contestId: parseInt(contestId),
        index: index,
        notes: content
      };
      await apiRequest(NOTES_SAVE_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
    }

    // ---------- MAIN HANDLERS ----------
    btnFetch.addEventListener('click', async () => {
      if (!isAuthenticated()) {
        showToast('Please login to continue', 'error');
        redirectToLogin();
        return;
      }

      const rawCid = inpContestId.value.trim();
      const rawIdx = normalizeIndex(inpIndex.value);
      
      if (!rawCid || !rawIdx) {
        showToast('Enter contest ID and problem index', 'error');
        return;
      }

      btnFetch.disabled = true;
      btnFetch.innerHTML = '<span>⏳</span> Loading...';
      problemInfo.classList.remove('active');
      notesArea.value = '';
      disableNotes('Fetching...');

      try {
        const meta = await fetchProblemMeta(rawCid, rawIdx);
        currentContestId = meta.contestId;
        currentIndex = meta.index;
        renderProblemMeta(meta);

        // Load note
        try {
          const note = await loadNote(currentContestId, currentIndex);
          notesArea.value = note.notes || '';
          originalNoteContent = notesArea.value;
          enableNotes('📄 Note loaded');
          saveStatusText.innerText = '✅ Synced';
        } catch (err) {
          if (err?.apiCode === 4005 || err?.message?.includes('not found')) {
            notesArea.value = '';
            originalNoteContent = '';
            enableNotes('✨ New note');
            saveStatusText.innerText = '📝 No notes yet';
          } else {
            throw err;
          }
        }
      } catch (err) {
        const msg = err?.apiCode ? (ERROR_MESSAGES[err.apiCode] || err.message) : 'Failed to fetch problem';
        showToast(msg, 'error');
        disableNotes('Error');
      } finally {
        btnFetch.disabled = false;
        btnFetch.innerHTML = '<span>📡</span> Fetch Details';
        updateCharCount();
      }
    });

    btnSave.addEventListener('click', async () => {
      if (!currentContestId || !currentIndex || !isAuthenticated()) return;

      const content = notesArea.value;
      setSavingState(true);
      
      try {
        await saveNote(currentContestId, currentIndex, content);
        originalNoteContent = content;
        saveStatusText.innerText = '💚 Saved';
        showToast('Note saved', 'success');
        setTimeout(() => {
          if (saveStatusText.innerText === '💚 Saved') saveStatusText.innerText = '✅ Synced';
        }, 2000);
      } catch (err) {
        const msg = err?.apiCode ? (ERROR_MESSAGES[err.apiCode] || err.message) : 'Save failed';
        showToast(msg, 'error');
        saveStatusText.innerText = '⚠️ Unsaved';
      } finally {
        setSavingState(false);
      }
    });

    notesArea.addEventListener('input', () => {
      updateCharCount();
      if (notesArea.value !== originalNoteContent) {
        saveStatusText.innerText = '🟡 Unsaved changes';
      } else {
        saveStatusText.innerText = '✅ Synced';
      }
    });

    // Ctrl+S shortcut
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        if (!btnSave.disabled && isAuthenticated()) btnSave.click();
      }
    });

    // Auto uppercase index
    inpIndex.addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase();
    });

    // URL params autofill
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const cid = params.get('contestId');
      const idx = params.get('index');
      if (cid) inpContestId.value = cid;
      if (idx) inpIndex.value = idx.toUpperCase();
      if (cid && idx && isAuthenticated()) {
        btnFetch.click();
      }
      updateAuthUI();
      updateCharCount();
    });

    // Initialize UI
    updateAuthUI();
  })();
</script>
</body>
</html>
